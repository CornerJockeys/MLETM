<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MLE TM PROD Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <main id="overlay" class="overlay" aria-label="MLE TM PROD broadcast overlay">
    <section id="match-banner" class="match-banner widget" aria-label="Match banner">
      <div class="banner-main">
        <div class="banner-side banner-side-a">
          <div class="logo-bed"><img id="team-a-logo" class="team-logo" alt=""></div>
          <div class="team-identity">
            <img id="team-a-wordmark" class="team-wordmark" alt="">
            <div id="team-a-name" class="team-name"></div>
          </div>
        </div>

        <div class="score-core">
          <div class="score-label">MAP SCORE</div>
          <div class="map-score"><span id="team-a-score">0</span><span class="score-divider">–</span><span id="team-b-score">0</span></div>
        </div>

        <div class="banner-side banner-side-b">
          <div class="team-identity team-identity-right">
            <img id="team-b-wordmark" class="team-wordmark" alt="">
            <div id="team-b-name" class="team-name"></div>
          </div>
          <div class="logo-bed"><img id="team-b-logo" class="team-logo" alt=""></div>
        </div>
      </div>

      <div class="round-strip" aria-label="Round wins">
        <div id="team-a-rounds" class="round-pips round-pips-a" aria-label="Team A round wins"></div>
        <div class="round-strip-spacer"></div>
        <div id="team-b-rounds" class="round-pips round-pips-b" aria-label="Team B round wins"></div>
      </div>

      <div class="banner-meta">
        <span id="division" class="division-pill">CL</span>
        <span id="match-label" class="meta-strong">M7</span>
        <span class="meta-separator">•</span>
        <span id="map-name" class="meta-map">BATTERY</span>
      </div>
    </section>

    <section id="records" class="records widget" aria-label="Map records">
      <div class="record-row">
        <span class="record-label">WORLD RECORD</span>
        <span id="world-record" class="record-time">0:41.686</span>
      </div>
      <div class="record-row record-row-division">
        <span id="division-record-label" class="record-label">CL RECORD</span>
        <span id="division-record" class="record-time">0:43.247</span>
      </div>
    </section>

    <section id="ranking" class="ranking widget" aria-label="Live ranking">
      <header class="ranking-header">
        <span>LIVE RANKING</span>
        <span class="ranking-round" id="ranking-round">ROUND 1</span>
      </header>
      <div id="ranking-rows" class="ranking-rows"></div>
      <footer class="ranking-footer">
        <span><b class="respawn-key">R</b> RESPAWN</span>
        <span class="camera-key"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h8A2.5 2.5 0 0 1 16 7.5v1.2l4-2.1A1 1 0 0 1 21.5 7.5v9a1 1 0 0 1-1.5.9L16 15.3v1.2a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 16.5v-9Z"/></svg> SPECTATED</span>
      </footer>
    </section>
  </main>

  <script src="js/state.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
