name: Stage local DB lockfile

on:
  push:
    branches:
      - local-pglite-dev-db
    paths:
      - "bot/scrims/package.json"
      - ".github/workflows/update-local-db-lock.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot/scrims
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: local-pglite-dev-db

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bot/scrims/package-lock.json

      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/scrims/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Update scrim bot lockfile for local PGlite"
            git push origin HEAD:local-pglite-dev-db
          fi
