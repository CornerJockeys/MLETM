name: Stage Scrim Runtime Archive

on:
  push:
    branches:
      - scrim-runtime-archive-v1
    paths:
      - ".github/workflows/stage-scrim-runtime-archive.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: scrim-runtime-archive-v1

      - name: Patch scrim archive flow
        shell: python
        run: |
          from pathlib import Path

          path = Path('bot/scrims/src/services/scrim.service.ts')
          text = path.read_text()
          text = text.replace("import { fixtureService } from './fixture.service.js';\n", "import { fixtureService } from './fixture.service.js';\nimport { playerService } from './player.service.js';\nimport { mletmArchiveService } from './mletm-archive.service.js';\n", 1)
          old = """      logger.info('Scrim created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        playerIds,\n        mapIds: maps.map(m => m.id)\n      });\n\n      return scrim;"""
          new = """      logger.info('Scrim created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        playerIds,\n        mapIds: maps.map(m => m.id)\n      });\n\n      await this.archiveScrimSession(scrim, playerIds, maps);\n\n      return scrim;"""
          if old not in text:
              raise SystemExit('scrim create archive seam not found')
          text = text.replace(old, new, 1)
          old = """      logger.info('Scheduled match created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        fixtureId: fixture?.fixtureId ?? null,\n        playerIds: players.map(p => p.id)\n      });\n\n      return scrim;"""
          new = """      logger.info('Scheduled match created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        fixtureId: fixture?.fixtureId ?? null,\n        playerIds: players.map(p => p.id)\n      });\n\n      await this.archiveScrimSession(scrim, players.map(p => p.id), []);\n\n      return scrim;"""
          if old not in text:
              raise SystemExit('scheduled archive seam not found')
          text = text.replace(old, new, 1)
          marker = """  /**\n   * Get a scrim by ID\n   */"""
          helper = """  private async archiveScrimSession(scrim: Scrim, playerIds: number[], maps: Map[]): Promise<void> {\n    try {\n      const players = await playerService.getByIds(playerIds);\n      await mletmArchiveService.archive(scrim.scrim_uid, 'session', {\n        scrimId: scrim.id,\n        scrimUid: scrim.scrim_uid,\n        league: scrim.league,\n        matchType: scrim.match_type,\n        status: scrim.status,\n        createdAt: new Date(scrim.created_at).toISOString(),\n        checkinDeadline: scrim.checkin_deadline ? new Date(scrim.checkin_deadline).toISOString() : null,\n        sprocket: {\n          matchParentId: scrim.sprocket_match_parent_id ?? null,\n          matchId: scrim.sprocket_match_id ?? null,\n        },\n        players: players.map((player) => ({\n          playerId: player.id,\n          discordId: player.discord_id,\n          discordUsername: player.discord_username,\n          platformAccountIds: player.platform_account_ids ?? [],\n          sprocketPlayerId: player.sprocket_player_id ?? null,\n          memberId: player.member_id ?? null,\n        })),\n        maps: maps.map((map, index) => ({\n          mapId: map.id,\n          mapUid: map.uid,\n          name: map.name,\n          author: map.author ?? null,\n          order: index + 1,\n        })),\n      });\n    } catch (error) {\n      logger.warn('Failed to build MLETM session archive payload', {\n        scrimId: scrim.id,\n        scrimUid: scrim.scrim_uid,\n        error,\n      });\n    }\n  }\n\n"""
          if marker not in text:
              raise SystemExit('scrim helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          path = Path('bot/scrims/src/services/replay-submission.service.ts')
          text = path.read_text()
          text = text.replace("import { logger } from '../utils/logger.js';\n", "import { logger } from '../utils/logger.js';\nimport { config } from '../config.js';\nimport { mletmArchiveService } from './mletm-archive.service.js';\n", 1)
          platform_start = text.index("  if (platformAccountId && platformAccountId.trim() !== '') {", text.index('async function findTrackmaniaPlayer'))
          platform_end = text.index("\n  if (fallbackDiscordUsername.trim() !== '') {", platform_start)
          replacement = """  if (platformAccountId && platformAccountId.trim() !== '') {\n    const localResult = await client.query<{ id: number; sprocket_player_id: number | null }>(\n      `SELECT id, sprocket_player_id\n       FROM ${appPlayersTable}\n       WHERE $1 = ANY(platform_account_ids)\n       LIMIT 2`,\n      [platformAccountId]\n    );\n\n    if (localResult.rows.length === 1) {\n      return {\n        localPlayerId: localResult.rows[0].id,\n        sprocketPlayerId: localResult.rows[0].sprocket_player_id,\n      };\n    }\n    if (localResult.rows.length > 1) {\n      throw new Error(`Multiple local Trackmania players resolved for platform account ${platformAccountId}`);\n    }\n\n    if (config.sprocket.integrationMode !== 'disabled') {\n      try {\n        const result = await client.query<{ id: number; sprocket_player_id: number | null }>(\n          `\n          SELECT lp.id, lp.sprocket_player_id\n          FROM ${appPlayersTable} lp\n          JOIN sprocket.member_platform_account mpa ON mpa.\"platformAccountId\" = $1\n          JOIN sprocket.player sp ON sp.id = lp.sprocket_player_id AND sp.\"memberId\" = mpa.\"memberId\"\n          JOIN sprocket.game_skill_group gsg ON gsg.id = sp.\"skillGroupId\"\n          JOIN sprocket.game g ON g.id = gsg.\"gameId\"\n          WHERE g.title = 'Trackmania'\n          LIMIT 2\n          `,\n          [platformAccountId]\n        );\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n      } catch (error) {\n        if (config.sprocket.integrationMode === 'required') {\n          throw error;\n        }\n        logger.warn('Sprocket replay-player lookup unavailable; continuing with local identity data', {\n          platformAccountId,\n          error,\n        });\n      }\n    }\n  }\n"""
          text = text[:platform_start] + replacement + text[platform_end:]
          text = text.replace("        sprocket_match_parent_id: number | null;\n", "        sprocket_match_parent_id: number | null;\n        scrim_uid: string;\n        league: string;\n", 1)
          text = text.replace("`SELECT id, status, elo_processed, sprocket_match_parent_id FROM ${this.scrimsTable} WHERE id = $1 FOR UPDATE`,", "`SELECT id, scrim_uid, league, status, elo_processed, sprocket_match_parent_id FROM ${this.scrimsTable} WHERE id = $1 FOR UPDATE`,", 1)
          text = text.replace("          if (!player || !player.localPlayerId || !player.sprocketPlayerId) {", "          if (!player || !player.localPlayerId) {", 1)
          old = """      await client.query('COMMIT');\n      return {\n        alreadyProcessed: false,\n        mapsSaved: mapsToSave.length,\n        insertedStats,\n        winnerTeam,\n      };"""
          new = """      await client.query('COMMIT');\n\n      await mletmArchiveService.archive(scrim.scrim_uid, 'submission', {\n        scrimId,\n        scrimUid: scrim.scrim_uid,\n        league: scrim.league,\n        winnerTeam,\n        replay,\n        parsedMaps: mapsToSave,\n        result: {\n          mapsSaved: mapsToSave.length,\n          insertedStats,\n          winnerTeam,\n        },\n      });\n\n      return {\n        alreadyProcessed: false,\n        mapsSaved: mapsToSave.length,\n        insertedStats,\n        winnerTeam,\n      };"""
          if old not in text:
              raise SystemExit('replay archive seam not found')
          text = text.replace(old, new, 1)
          method_start = text.index("  private async awardEligibilityPoints(")
          method_end = text.index("\n  }\n}\n\nexport const replaySubmissionService", method_start) + 4
          method = """  private async awardEligibilityPoints(\n    client: Queryable,\n    scrimId: number,\n    matchParentId: number | null,\n    points: number\n  ): Promise<void> {\n    if (config.sprocket.integrationMode === 'disabled') {\n      return;\n    }\n\n    if (!matchParentId) {\n      if (config.sprocket.integrationMode === 'required') {\n        throw new Error('Scrim is missing sprocket_match_parent_id.');\n      }\n      logger.warn('Skipping Sprocket eligibility award for standalone MLETM scrim', { scrimId });\n      return;\n    }\n\n    const playerResult = await client.query<{ sprocket_player_id: number }>(\n      `\n      SELECT DISTINCT p.sprocket_player_id\n      FROM ${tableName('scrim_players')} sp\n      JOIN ${tableName('players')} p ON p.id = sp.player_id\n      WHERE sp.scrim_id = $1\n        AND p.sprocket_player_id IS NOT NULL\n      `,\n      [scrimId]\n    );\n\n    if (playerResult.rows.length === 0) {\n      if (config.sprocket.integrationMode === 'required') {\n        throw new Error('No Sprocket player IDs found for scrim eligibility award.');\n      }\n      logger.warn('Skipping Sprocket eligibility award; no linked Sprocket players', { scrimId });\n      return;\n    }\n\n    await client.query('SAVEPOINT sprocket_eligibility');\n    try {\n      for (const row of playerResult.rows) {\n        await client.query(\n          `\n          INSERT INTO sprocket.eligibility_data (\"points\", \"matchParentId\", \"playerId\")\n          VALUES ($1, $2, $3)\n          ON CONFLICT (\"matchParentId\", \"playerId\") DO NOTHING\n          `,\n          [points, matchParentId, row.sprocket_player_id]\n        );\n      }\n      await client.query('RELEASE SAVEPOINT sprocket_eligibility');\n    } catch (error) {\n      await client.query('ROLLBACK TO SAVEPOINT sprocket_eligibility');\n      await client.query('RELEASE SAVEPOINT sprocket_eligibility');\n      if (config.sprocket.integrationMode === 'required') {\n        throw error;\n      }\n      logger.warn('Sprocket eligibility write unavailable; preserving standalone replay result', {\n        scrimId,\n        error,\n      });\n    }\n  }"""
          text = text[:method_start] + method + text[method_end:]
          path.write_text(text)

          path = Path('bot/scrims/src/services/elo.service.ts')
          text = path.read_text()
          text = text.replace("import { logger } from '../utils/logger.js';\n", "import { logger } from '../utils/logger.js';\nimport { mletmArchiveService } from './mletm-archive.service.js';\n", 1)
          old = """            const team1Result = scrim.winner_team === 1 ? 1 : 0;\n            const team2Result = scrim.winner_team === 2 ? 1 : 0;\n\n            // Update Team 1 Players"""
          new = """            const team1Result = scrim.winner_team === 1 ? 1 : 0;\n            const team2Result = scrim.winner_team === 2 ? 1 : 0;\n            const outputPlayers: Array<{\n                playerId: number;\n                team: 1 | 2;\n                isWin: boolean;\n                oldRating: number;\n                newRating: number;\n                ratingChange: number;\n            }> = [];\n\n            // Update Team 1 Players"""
          if old not in text:
              raise SystemExit('elo output list seam not found')
          text = text.replace(old, new, 1)
          old = """                await this.updatePlayerRating(client, p.player_id, scrim.id, scrim.league, currentRating, newRating, team1Result === 1);\n            }"""
          new = """                await this.updatePlayerRating(client, p.player_id, scrim.id, scrim.league, currentRating, newRating, team1Result === 1);\n                outputPlayers.push({\n                    playerId: p.player_id,\n                    team: 1,\n                    isWin: team1Result === 1,\n                    oldRating: currentRating.rating,\n                    newRating,\n                    ratingChange: newRating - currentRating.rating,\n                });\n            }"""
          if old not in text:
              raise SystemExit('elo team1 seam not found')
          text = text.replace(old, new, 1)
          old = """                await this.updatePlayerRating(client, p.player_id, scrim.id, scrim.league, currentRating, newRating, team2Result === 1);\n            }"""
          new = """                await this.updatePlayerRating(client, p.player_id, scrim.id, scrim.league, currentRating, newRating, team2Result === 1);\n                outputPlayers.push({\n                    playerId: p.player_id,\n                    team: 2,\n                    isWin: team2Result === 1,\n                    oldRating: currentRating.rating,\n                    newRating,\n                    ratingChange: newRating - currentRating.rating,\n                });\n            }"""
          if old not in text:
              raise SystemExit('elo team2 seam not found')
          text = text.replace(old, new, 1)
          old = """            await client.query('COMMIT');\n            logger.info(`Elo processed for scrim ${scrimId}`);\n"""
          new = """            await client.query('COMMIT');\n            logger.info(`Elo processed for scrim ${scrimId}`);\n\n            await mletmArchiveService.archive(scrim.scrim_uid, 'result', {\n                scrimId: scrim.id,\n                scrimUid: scrim.scrim_uid,\n                league: scrim.league,\n                winnerTeam: scrim.winner_team,\n                completedAt: scrim.completed_at ? new Date(scrim.completed_at).toISOString() : new Date().toISOString(),\n                sprocket: {\n                    matchParentId: scrim.sprocket_match_parent_id ?? null,\n                    matchId: scrim.sprocket_match_id ?? null,\n                },\n                players: outputPlayers,\n            });\n"""
          if old not in text:
              raise SystemExit('elo archive seam not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('backend/api/src/index.js')
          text = path.read_text()
          text = text.replace('import clubTagsSnapshot from "../../data/club-tags.json";\n', 'import clubTagsSnapshot from "../../data/club-tags.json";\nimport { handleRuntimeArchivePost } from "./runtime-archive.js";\n', 1)
          old = """export default {\n  async fetch(request) {\n    const url = new URL(request.url);\n\n    try {\n      if (request.method !== \"GET\") {\n        return jsonError(\"method_not_allowed\", 405);\n      }\n\n      const v1Response = handleV1Get(url);\n      if (v1Response) {\n        return v1Response;\n      }\n\n      // Temporary compatibility aliases for the current plugin/leaderboard work.\n      // New consumers should use /v1 routes.\n      const legacyResponse = handleLegacyGet(url);\n      if (legacyResponse) {\n        return legacyResponse;\n      }\n\n      return jsonError(\"not_found\", 404);\n    } catch (error) {\n      console.error(\"MLE TM API error\", error);\n      return jsonError(\"internal_error\", 500, {\n        detail: error instanceof Error ? error.message : String(error),\n      });\n    }\n  },\n};\n"""
          new = """export default {\n  async fetch(request, env) {\n    const url = new URL(request.url);\n\n    try {\n      if (request.method === \"GET\") {\n        const v1Response = handleV1Get(url);\n        if (v1Response) {\n          return v1Response;\n        }\n\n        // Temporary compatibility aliases for the current plugin/leaderboard work.\n        // New consumers should use /v1 routes.\n        const legacyResponse = handleLegacyGet(url);\n        if (legacyResponse) {\n          return legacyResponse;\n        }\n\n        return jsonError(\"not_found\", 404);\n      }\n\n      if (request.method === \"POST\") {\n        const runtimeResponse = await handleRuntimeArchivePost(request, url, env);\n        return runtimeResponse ?? jsonError(\"not_found\", 404);\n      }\n\n      return jsonError(\"method_not_allowed\", 405);\n    } catch (error) {\n      console.error(\"MLE TM API error\", error);\n      return jsonError(\"internal_error\", 500, {\n        detail: error instanceof Error ? error.message : String(error),\n      });\n    }\n  },\n};\n"""
          if old not in text:
              raise SystemExit('backend fetch seam not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Install scrim bot dependencies
        working-directory: bot/scrims
        run: npm ci

      - name: Build scrim bot
        working-directory: bot/scrims
        run: npm run build

      - name: Check Worker syntax
        run: |
          node --check backend/api/src/index.js
          node --check backend/api/src/runtime-archive.js

      - name: Remove staging workflow and commit
        run: |
          rm .github/workflows/stage-scrim-runtime-archive.yml
          git config user.name "Corners"
          git config user.email "46761220+CornerJockeys@users.noreply.github.com"
          git add bot/scrims backend/api .github/workflows/stage-scrim-runtime-archive.yml
          git commit -m "Archive scrim lifecycle artifacts through MLETM API"
          git push origin HEAD:scrim-runtime-archive-v1
