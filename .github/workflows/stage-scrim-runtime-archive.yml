name: Stage Scrim Runtime Archive

on:
  push:
    branches:
      - scrim-runtime-archive-v1
    paths:
      - ".github/workflows/stage-scrim-runtime-archive.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: scrim-runtime-archive-v1

      - name: Patch scrim archive flow
        shell: python
        run: |
          from pathlib import Path

          # --- Scrim session archive ---
          path = Path('bot/scrims/src/services/scrim.service.ts')
          text = path.read_text()
          text = text.replace(
              "import { fixtureService } from './fixture.service.js';\n",
              "import { fixtureService } from './fixture.service.js';\nimport { playerService } from './player.service.js';\nimport { mletmArchiveService } from './mletm-archive.service.js';\n",
              1,
          )
          first_log = """      logger.info('Scrim created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        playerIds,\n        mapIds: maps.map(m => m.id)\n      });\n\n      return scrim;"""
          first_new = """      logger.info('Scrim created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        playerIds,\n        mapIds: maps.map(m => m.id)\n      });\n\n      await this.archiveScrimSession(scrim, playerIds, maps);\n\n      return scrim;"""
          if first_log not in text:
              raise SystemExit('scrim create archive seam not found')
          text = text.replace(first_log, first_new, 1)

          scheduled_log = """      logger.info('Scheduled match created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        fixtureId: fixture?.fixtureId ?? null,\n        playerIds: players.map(p => p.id)\n      });\n\n      return scrim;"""
          scheduled_new = """      logger.info('Scheduled match created', {\n        scrimId: scrim.id,\n        scrimUid,\n        league,\n        fixtureId: fixture?.fixtureId ?? null,\n        playerIds: players.map(p => p.id)\n      });\n\n      await this.archiveScrimSession(scrim, players.map(p => p.id), []);\n\n      return scrim;"""
          if scheduled_log not in text:
              raise SystemExit('scheduled archive seam not found')
          text = text.replace(scheduled_log, scheduled_new, 1)

          marker = """  /**\n   * Get a scrim by ID\n   */"""
          helper = """  private async archiveScrimSession(scrim: Scrim, playerIds: number[], maps: Map[]): Promise<void> {\n    try {\n      const players = await playerService.getByIds(playerIds);\n      await mletmArchiveService.archive(scrim.scrim_uid, 'session', {\n        scrimId: scrim.id,\n        scrimUid: scrim.scrim_uid,\n        league: scrim.league,\n        matchType: scrim.match_type,\n        status: scrim.status,\n        createdAt: new Date(scrim.created_at).toISOString(),\n        checkinDeadline: scrim.checkin_deadline\n          ? new Date(scrim.checkin_deadline).toISOString()\n          : null,\n        sprocket: {\n          matchParentId: scrim.sprocket_match_parent_id ?? null,\n          matchId: scrim.sprocket_match_id ?? null,\n        },\n        players: players.map((player) => ({\n          playerId: player.id,\n          discordId: player.discord_id,\n          discordUsername: player.discord_username,\n          platformAccountIds: player.platform_account_ids ?? [],\n          sprocketPlayerId: player.sprocket_player_id ?? null,\n          memberId: player.member_id ?? null,\n        })),\n        maps: maps.map((map, index) => ({\n          mapId: map.id,\n          mapUid: map.uid,\n          name: map.name,\n          author: map.author ?? null,\n          order: index + 1,\n        })),\n      });\n    } catch (error) {\n      logger.warn('Failed to build MLETM session archive payload', {\n        scrimId: scrim.id,\n        scrimUid: scrim.scrim_uid,\n        error,\n      });\n    }\n  }\n\n"""
          if marker not in text:
              raise SystemExit('scrim helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          # --- Replay/submission decoupling + archive ---
          path = Path('bot/scrims/src/services/replay-submission.service.ts')
          text = path.read_text()
          text = text.replace(
              "import { logger } from '../utils/logger.js';\n",
              "import { logger } from '../utils/logger.js';\nimport { config } from '../config.js';\nimport { mletmArchiveService } from './mletm-archive.service.js';\n",
              1,
          )

          platform_start = text.index("  if (platformAccountId && platformAccountId.trim() !== '') {", text.index('async function findTrackmaniaPlayer'))
          platform_end = text.index("\n  if (fallbackDiscordUsername.trim() !== '') {", platform_start)
          replacement = """  if (platformAccountId && platformAccountId.trim() !== '') {\n    const localResult = await client.query<{ id: number; sprocket_player_id: number | null }>(\n      `SELECT id, sprocket_player_id\n       FROM ${appPlayersTable}\n       WHERE $1 = ANY(platform_account_ids)\n       LIMIT 2`,\n      [platformAccountId]\n    );\n\n    if (localResult.rows.length === 1) {\n      return {\n        localPlayerId: localResult.rows[0].id,\n        sprocketPlayerId: localResult.rows[0].sprocket_player_id,\n      };\n    }\n    if (localResult.rows.length > 1) {\n      throw new Error(`Multiple local Trackmania players resolved for platform account ${platformAccountId}`);\n    }\n\n    if (config.sprocket.integrationMode !== 'disabled') {\n      try {\n        const result = await client.query<{ id: number; sprocket_player_id: number | null }>(\n          `\n          SELECT lp.id, lp.sprocket_player_id\n          FROM ${appPlayersTable} lp\n          JOIN sprocket.member_platform_account mpa\n            ON mpa.\"platformAccountId\" = $1\n          JOIN sprocket.player sp\n            ON sp.id = lp.sprocket_player_id\n           AND sp.\"memberId\" = mpa.\"memberId\"\n          JOIN sprocket.game_skill_group gsg ON gsg.id = sp.\"skillGroupId\"\n          JOIN sprocket.game g ON g.id = gsg.\"gameId\"\n          WHERE g.title = 'Trackmania'\n          LIMIT 2\n          `,\n          [platformAccountId]\n        );\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n      } catch (error) {\n        if (config.sprocket.integrationMode === 'required') {\n          throw error;\n        }\n        logger.warn('Sprocket replay-player lookup unavailable; continuing with local identity data', {\n          platformAccountId,\n          error,\n        });\n      }\n    }\n  }\n"""
          text = text[:platform_start] + replacement + text[platform_end:]
          text = text.replace(
              "        sprocket_match_parent_id: number | null;\n",
              "        sprocket_match_parent_id: number | null;\n        scrim_uid: string;\n        league: string;\n",
              1,
          )
          text = text.replace(
              "`SELECT id, status, elo_processed, sprocket_match_parent_id FROM ${this.scrimsTable} WHERE id = $1 FOR UPDATE`,",
