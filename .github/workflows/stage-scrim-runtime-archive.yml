          commit_return = """      await client.query('COMMIT');\n      return {\n        alreadyProcessed: false,\n        mapsSaved: mapsToSave.length,\n        insertedStats,\n        winnerTeam,\n      };"""
          commit_new = """      await client.query('COMMIT');\n\n      await mletmArchiveService.archive(scrim.scrim_uid, 'submission', {\n        scrimId,\n        scrimUid: scrim.scrim_uid,\n        league: scrim.league,\n        winnerTeam,\n        replay,\n        parsedMaps: mapsToSave,\n        result: {\n          mapsSaved: mapsToSave.length,\n          insertedStats,\n          winnerTeam,\n        },\n      });\n\n      return {\n        alreadyProcessed: false,\n        mapsSaved: mapsToSave.length,\n        insertedStats,\n        winnerTeam,\n      };"""
