name: Fix Replay Sprocket Savepoint

on:
  push:
    branches:
      - scrim-runtime-archive-v1
    paths:
      - ".github/workflows/fix-replay-sprocket-savepoint.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: scrim-runtime-archive-v1
      - name: Wrap optional replay Sprocket lookup in savepoint
        shell: python
        run: |
          from pathlib import Path
          path = Path('bot/scrims/src/services/replay-submission.service.ts')
          text = path.read_text()
          old = """    if (config.sprocket.integrationMode !== 'disabled') {\n      try {\n        const result = await client.query<{ id: number; sprocket_player_id: number | null }>(\n          `\n          SELECT lp.id, lp.sprocket_player_id\n          FROM ${appPlayersTable} lp\n          JOIN sprocket.member_platform_account mpa ON mpa.\"platformAccountId\" = $1\n          JOIN sprocket.player sp ON sp.id = lp.sprocket_player_id AND sp.\"memberId\" = mpa.\"memberId\"\n          JOIN sprocket.game_skill_group gsg ON gsg.id = sp.\"skillGroupId\"\n          JOIN sprocket.game g ON g.id = gsg.\"gameId\"\n          WHERE g.title = 'Trackmania'\n          LIMIT 2\n          `,\n          [platformAccountId]\n        );\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n      } catch (error) {\n        if (config.sprocket.integrationMode === 'required') {\n          throw error;\n        }\n        logger.warn('Sprocket replay-player lookup unavailable; continuing with local identity data', {\n          platformAccountId,\n          error,\n        });\n      }\n    }\n"""
          new = """    if (config.sprocket.integrationMode !== 'disabled') {\n      await client.query('SAVEPOINT sprocket_player_lookup');\n      try {\n        const result = await client.query<{ id: number; sprocket_player_id: number | null }>(\n          `\n          SELECT lp.id, lp.sprocket_player_id\n          FROM ${appPlayersTable} lp\n          JOIN sprocket.member_platform_account mpa ON mpa.\"platformAccountId\" = $1\n          JOIN sprocket.player sp ON sp.id = lp.sprocket_player_id AND sp.\"memberId\" = mpa.\"memberId\"\n          JOIN sprocket.game_skill_group gsg ON gsg.id = sp.\"skillGroupId\"\n          JOIN sprocket.game g ON g.id = gsg.\"gameId\"\n          WHERE g.title = 'Trackmania'\n          LIMIT 2\n          `,\n          [platformAccountId]\n        );\n\n        await client.query('RELEASE SAVEPOINT sprocket_player_lookup');\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n      } catch (error) {\n        await client.query('ROLLBACK TO SAVEPOINT sprocket_player_lookup');\n        await client.query('RELEASE SAVEPOINT sprocket_player_lookup');\n        if (config.sprocket.integrationMode === 'required') {\n          throw error;\n        }\n        logger.warn('Sprocket replay-player lookup unavailable; continuing with local identity data', {\n          platformAccountId,\n          error,\n        });\n      }\n    }\n"""
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
      - working-directory: bot/scrims
        run: npm ci
      - working-directory: bot/scrims
        run: npm run build
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-replay-sprocket-savepoint.yml
          git config user.name "Corners"
          git config user.email "46761220+CornerJockeys@users.noreply.github.com"
          git add bot/scrims/src/services/replay-submission.service.ts .github/workflows/fix-replay-sprocket-savepoint.yml
          git commit -m "Protect optional replay Sprocket lookup"
          git push origin HEAD:scrim-runtime-archive-v1
