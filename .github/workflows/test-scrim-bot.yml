name: Test MLE TM Scrim Bot

on:
  push:
    paths:
      - "bot/scrims/**"
      - ".github/workflows/test-scrim-bot.yml"
  pull_request:
    paths:
      - "bot/scrims/**"
      - ".github/workflows/test-scrim-bot.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bot/scrims

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bot/scrims/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build
