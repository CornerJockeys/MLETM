name: Fix Replay Savepoint Order

on:
  push:
    branches:
      - scrim-runtime-archive-v1
    paths:
      - ".github/workflows/fix-replay-savepoint-order.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: scrim-runtime-archive-v1
      - name: Fix savepoint release order
        shell: python
        run: |
          from pathlib import Path
          path = Path('bot/scrims/src/services/replay-submission.service.ts')
          text = path.read_text()
          old = """        await client.query('RELEASE SAVEPOINT sprocket_player_lookup');\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n"""
          new = """        if (result.rows.length > 1) {\n          throw new Error(`Multiple Trackmania players resolved for platform account ${platformAccountId}`);\n        }\n\n        await client.query('RELEASE SAVEPOINT sprocket_player_lookup');\n\n        if (result.rows.length === 1) {\n          return {\n            localPlayerId: result.rows[0].id,\n            sprocketPlayerId: result.rows[0].sprocket_player_id,\n          };\n        }\n"""
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
      - working-directory: bot/scrims
        run: npm ci
      - working-directory: bot/scrims
        run: npm run build
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-replay-savepoint-order.yml
          git config user.name "Corners"
          git config user.email "46761220+CornerJockeys@users.noreply.github.com"
          git add bot/scrims/src/services/replay-submission.service.ts .github/workflows/fix-replay-savepoint-order.yml
          git commit -m "Fix replay lookup savepoint release order"
          git push origin HEAD:scrim-runtime-archive-v1
