name: One-time import TM scrim bot

on:
  push:
    branches:
      - import-scrim-bot-v1
    paths:
      - ".github/workflows/import-scrim-bot.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Stage scrim bot importer'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout import branch
        uses: actions/checkout@v6
        with:
          ref: import-scrim-bot-v1
          fetch-depth: 0

      - name: Import upstream tm-q-bot
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add tm-q-bot https://github.com/Minor-League-Esports/tm-q-bot.git
          git fetch --depth=1 tm-q-bot main

          mkdir -p bot/scrims
          find bot/scrims -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git archive tm-q-bot/main | tar -x -C bot/scrims

          # Do not vendor upstream deployment workflows, the legacy Apps Script
          # parser, or old host-specific service files into the MLETM scrim bot.
          rm -rf bot/scrims/.github
          rm -rf bot/scrims/parser
          rm -rf bot/scrims/systemd
          rm -f bot/scrims/pr-body.md

          # Preserve the original project README separately and make the MLETM
          # ownership/path explicit at the folder root.
          mv bot/scrims/README.md bot/scrims/UPSTREAM_README.md
          cat > bot/scrims/README.md <<'EOF'
          # MLE TM Scrims Bot

          Player-facing Discord bot for MLE Trackmania scrim queues, check-in, map selection, match creation, and related queue operations.

          This codebase was imported from `Minor-League-Esports/tm-q-bot` and is being adapted to use the MLETM backend as the self-sufficient Trackmania data layer. The original upstream README is retained as `UPSTREAM_README.md`.

          ## Identity direction

          Discord ID is the only authoritative Discord identity key. Discord usernames are display-only and must not be used for identity matching.

          Player resolution should prefer the existing Sprocket/MLEDB source when it is usable, then fall back to the MLETM API by Discord ID.
          EOF

          cat > bot/scrims/UPSTREAM.md <<'EOF'
          # Upstream provenance

          Imported from:

          - Repository: `Minor-League-Esports/tm-q-bot`
          - Upstream commit: `0201c534c824347163df9815354546efc6fa4070`
          - Imported for MLETM scrim-bot development.

          The upstream project carries a GNU GPL v3 license. Its `LICENSE` file is retained inside this directory.
          EOF

          rm -f bot/scrims/IMPORT_IN_PROGRESS.md

          # Remove this one-time workflow from the resulting branch.
          rm -f .github/workflows/import-scrim-bot.yml

          git add -A
          git commit -m "Import tm-q-bot scrim base"
          git push origin HEAD:import-scrim-bot-v1
