name: Stage Standalone Scrim Mode

on:
  push:
    branches:
      - standalone-scrim-archive
    paths:
      - ".github/workflows/stage-standalone-scrim.yml"

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: standalone-scrim-archive

      - name: Patch standalone Sprocket mode
        shell: python
        run: |
          from pathlib import Path

          config_path = Path('bot/scrims/src/config.ts')
          config = config_path.read_text()
          config = config.replace(
              "interface Config {\n",
              "type SprocketIntegrationMode = 'required' | 'optional' | 'disabled';\n\ninterface Config {\n",
              1,
          )
          config = config.replace(
              "  mletmApi: {\n    baseUrl: string;\n    timeoutMs: number;\n  };\n",
              "  mletmApi: {\n    baseUrl: string;\n    timeoutMs: number;\n  };\n  sprocket: {\n    integrationMode: SprocketIntegrationMode;\n  };\n",
              1,
          )
          marker = "function getEnvNumber(key: string, defaultValue: number): number {\n"
          idx = config.index(marker)
          end = config.index("\n}\n\nexport const config", idx) + 3
          helper = "\nfunction getSprocketIntegrationMode(): SprocketIntegrationMode {\n  const value = getEnvVar('SPROCKET_INTEGRATION_MODE', 'optional').trim().toLowerCase();\n  if (value === 'required' || value === 'optional' || value === 'disabled') {\n    return value;\n  }\n  throw new Error('SPROCKET_INTEGRATION_MODE must be required, optional, or disabled');\n}\n"
          config = config[:end] + helper + config[end:]
          config = config.replace(
              "  appScript: {\n    baseUrl: getEnvVar('APPSCRIPT_BASE_URL'),\n  },\n",
              "  sprocket: {\n    integrationMode: getSprocketIntegrationMode(),\n  },\n  appScript: {\n    baseUrl: getEnvVar('APPSCRIPT_BASE_URL'),\n  },\n",
              1,
          )
          config_path.write_text(config)

          env_path = Path('bot/scrims/.env.example')
          env = env_path.read_text()
          env = env.replace(
              "# MLETM API fallback\nMLETM_API_BASE_URL=https://mle-tm-temp-api.mschifanoiii.workers.dev\nMLETM_API_TIMEOUT_MS=5000\n",
              "# MLETM API fallback\nMLETM_API_BASE_URL=https://mle-tm-temp-api.mschifanoiii.workers.dev\nMLETM_API_TIMEOUT_MS=5000\n\n# Legacy Sprocket coupling\n# optional = attempt linkage but keep standalone MLETM scrims working if Sprocket is unavailable\n# required = inherited all-or-nothing behavior\n# disabled = do not attempt Sprocket writes\nSPROCKET_INTEGRATION_MODE=optional\n",
              1,
          )
          env_path.write_text(env)

          scrim_path = Path('bot/scrims/src/services/scrim.service.ts')
          scrim = scrim_path.read_text()
          old = """      const sprocketMatch = await sprocketService.createMatchParentAndMatch(client, league, scrimUid);\n\n      // Create scrim"""
          new = """      let sprocketMatch: { matchParentId: number; matchId: number } | null = null;\n\n      if (config.sprocket.integrationMode !== 'disabled') {\n        await client.query('SAVEPOINT sprocket_integration');\n        try {\n          sprocketMatch = await sprocketService.createMatchParentAndMatch(client, league, scrimUid);\n          await client.query('RELEASE SAVEPOINT sprocket_integration');\n        } catch (error) {\n          await client.query('ROLLBACK TO SAVEPOINT sprocket_integration');\n          await client.query('RELEASE SAVEPOINT sprocket_integration');\n\n          if (config.sprocket.integrationMode === 'required') {\n            throw error;\n          }\n\n          logger.warn('Sprocket linkage unavailable; creating standalone MLETM scrim', {\n            scrimUid,\n            league,\n            error,\n          });\n        }\n      }\n\n      // Create scrim"""
          if old not in scrim:
              raise SystemExit('queue Sprocket block not found')
          scrim = scrim.replace(old, new, 1)
          scrim = scrim.replace(
              "          sprocketMatch.matchParentId,\n          sprocketMatch.matchId,",
              "          sprocketMatch?.matchParentId ?? null,\n          sprocketMatch?.matchId ?? null,",
              1,
          )

          old = """      const fixture = options.fixtureId\n        ? await fixtureService.resolveFixture(client, options.fixtureId, league)\n        : options.homeFranchise && options.awayFranchise\n          ? await fixtureService.getOrCreateTestFixture(client, {\n              league,\n              homeFranchise: options.homeFranchise,\n              awayFranchise: options.awayFranchise,\n              scheduleGroupId: options.scheduleGroupId,\n              week: options.week,\n            })\n          : null;\n      const sprocketMatch = await sprocketService.createMatchParentAndMatch(\n        client,\n        league,\n        scrimUid,\n        fixture?.fixtureId\n      );\n"""
          new = """      let fixture: { fixtureId: number } | null = null;\n      let sprocketMatch: { matchParentId: number; matchId: number } | null = null;\n\n      if (config.sprocket.integrationMode !== 'disabled') {\n        await client.query('SAVEPOINT sprocket_integration');\n        try {\n          fixture = options.fixtureId\n            ? await fixtureService.resolveFixture(client, options.fixtureId, league)\n            : options.homeFranchise && options.awayFranchise\n              ? await fixtureService.getOrCreateTestFixture(client, {\n                  league,\n                  homeFranchise: options.homeFranchise,\n                  awayFranchise: options.awayFranchise,\n                  scheduleGroupId: options.scheduleGroupId,\n                  week: options.week,\n                })\n              : null;\n          sprocketMatch = await sprocketService.createMatchParentAndMatch(\n            client,\n            league,\n            scrimUid,\n            fixture?.fixtureId\n          );\n          await client.query('RELEASE SAVEPOINT sprocket_integration');\n        } catch (error) {\n          await client.query('ROLLBACK TO SAVEPOINT sprocket_integration');\n          await client.query('RELEASE SAVEPOINT sprocket_integration');\n\n          if (config.sprocket.integrationMode === 'required') {\n            throw error;\n          }\n\n          fixture = null;\n          sprocketMatch = null;\n          logger.warn('Sprocket linkage unavailable; creating standalone MLETM scheduled match', {\n            scrimUid,\n            league,\n            error,\n          });\n        }\n      }\n"""
          if old not in scrim:
              raise SystemExit('scheduled Sprocket block not found')
          scrim = scrim.replace(old, new, 1)
          scrim = scrim.replace(
              "[scrimUid, league, sprocketMatch.matchParentId, sprocketMatch.matchId]",
              "[scrimUid, league, sprocketMatch?.matchParentId ?? null, sprocketMatch?.matchId ?? null]",
              1,
          )
          scrim_path.write_text(scrim)

      - name: Install scrim bot dependencies
        working-directory: bot/scrims
        run: npm ci

      - name: Build scrim bot
        working-directory: bot/scrims
        run: npm run build

      - name: Remove staging workflow and commit
        run: |
          rm .github/workflows/stage-standalone-scrim.yml
          git config user.name "Corners"
          git config user.email "46761220+CornerJockeys@users.noreply.github.com"
          git add bot/scrims/src/config.ts bot/scrims/src/services/scrim.service.ts bot/scrims/.env.example .github/workflows/stage-standalone-scrim.yml
          git commit -m "Decouple standalone scrims from Sprocket"
          git push origin HEAD:standalone-scrim-archive
